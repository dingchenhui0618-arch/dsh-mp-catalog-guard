name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The build is dependency-free on purpose: no npm install step.
      - name: build
        run: node scripts/build.mjs

      - name: lib is in sync with src
        run: git diff --exit-code -- lib

      - name: test
        run: node --test test/*.test.mjs

      - name: demo end to end
        run: node scripts/demo.mjs
